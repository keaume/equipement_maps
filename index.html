<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sites p&eacute;troliers et permis &mdash; Qu&eacute;bec</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  :root {
    --bg: #f4f6f5;
    --panel-bg: #ffffff;
    --border: #dfe3e1;
    --text: #1f2a24;
    --muted: #6b7a72;
    --accent: #1f7a4d;
    --accent-dark: #16603b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); }

  #tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-dark);
    padding: 0 12px;
    height: 52px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    position: relative;
    z-index: 1000;
  }
  #tabs .brand {
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    margin-right: 18px;
    white-space: nowrap;
  }
  #tabs button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,.75);
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color .15s, border-color .15s;
  }
  #tabs button:hover { color: #fff; }
  #tabs button.active { color: #fff; border-bottom-color: #ffffff; }

  .view { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; display: none; }
  .view.active { display: block; }
  .map { position: absolute; inset: 0; }

  .infobar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 900;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    white-space: nowrap;
  }

  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 900;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    width: 250px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    font-size: 13px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 14px; }
  .panel label { display: block; font-weight: 600; margin: 10px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  .panel select, .panel input[type=text] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff;
  }
  .panel .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; }
  .panel .checkbox-row label { margin: 0; font-weight: 500; text-transform: none; color: var(--text); font-size: 13px; }
  .panel button.reset {
    margin-top: 14px; width: 100%; background: var(--accent); color: #fff; border: none;
    padding: 8px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .panel button.reset:hover { background: var(--accent-dark); }
  .panel .count { margin-top: 10px; color: var(--muted); font-size: 12px; }

  .search-box {
    position: absolute; top: 12px; left: 12px; z-index: 900;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    width: 230px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    font-size: 13px;
  }
  .search-box label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
  .search-box .row { display: flex; gap: 6px; }
  .search-box input { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .search-box button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  .search-box button:hover { background: var(--accent-dark); }

  .legend {
    position: absolute; bottom: 20px; left: 12px; z-index: 900;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .legend .title { font-weight: 700; margin-bottom: 6px; }
  .legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.3); }

  .leaflet-popup-content { font-size: 13px; line-height: 1.6; }
  .leaflet-popup-content b.title { font-size: 14px; display: block; margin-bottom: 4px; }
  .leaflet-popup-content .warn { color: #b3401f; font-weight: 700; }
  .leaflet-popup-content .ok { color: #1f7a4d; font-weight: 600; }

  .site-cluster { border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-weight: 700; color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.6); }

  @media (max-width: 640px) {
    .panel, .search-box { width: calc(50% - 18px); }
    .infobar { font-size: 12px; padding: 6px 10px; }
    #tabs .brand { display: none; }
  }
</style>
</head>
<body>

<div id="tabs">
  <span class="brand">Environnement &mdash; Hydrocarbures</span>
  <button id="tab-btn-sites" class="active" onclick="switchTab('sites')">Sites et &eacute;quipements p&eacute;troliers</button>
  <button id="tab-btn-permis" onclick="switchTab('permis')">Titulaires de permis</button>
</div>

<div id="view-sites" class="view active">
  <div id="map-sites" class="map"></div>
  <div class="infobar" id="infobar-sites">Chargement&hellip;</div>
  <div class="search-box">
    <label>Rechercher une municipalit&eacute;</label>
    <div class="row">
      <input type="text" id="search-sites" list="datalist-sites" placeholder="Ex: Amqui">
      <button onclick="goToSearch('sites')">OK</button>
    </div>
    <datalist id="datalist-sites"></datalist>
  </div>
  <div class="panel">
    <h3>Filtres</h3>
    <label>R&eacute;gion administrative</label>
    <select id="filter-region-sites" onchange="applyFilters('sites')"></select>
    <label>Municipalit&eacute;</label>
    <select id="filter-muni-sites" onchange="applyFilters('sites')"></select>
    <div class="checkbox-row">
      <input type="checkbox" id="filter-sanspermis-sites" onchange="applyFilters('sites')">
      <label for="filter-sanspermis-sites">Sans permis actif seulement</label>
    </div>
    <button class="reset" onclick="resetFilters('sites')">R&eacute;initialiser</button>
    <div class="count" id="count-sites"></div>
  </div>
  <div class="legend" id="legend-sites">
    <div class="title">L&eacute;gende</div>
    <div class="row"><span class="dot" style="background:#3aa65a"></span>Site avec permis actif</div>
    <div class="row"><span class="dot" style="background:#9a9a9a"></span>Sans permis actif</div>
  </div>
</div>

<div id="view-permis" class="view">
  <div id="map-permis" class="map"></div>
  <div class="infobar" id="infobar-permis">Chargement&hellip;</div>
  <div class="search-box">
    <label>Rechercher une municipalit&eacute;</label>
    <div class="row">
      <input type="text" id="search-permis" list="datalist-permis" placeholder="Ex: Amqui">
      <button onclick="goToSearch('permis')">OK</button>
    </div>
    <datalist id="datalist-permis"></datalist>
  </div>
  <div class="panel">
    <h3>Filtres</h3>
    <label>R&eacute;gion administrative</label>
    <select id="filter-region-permis" onchange="applyFilters('permis')"></select>
    <label>Municipalit&eacute;</label>
    <select id="filter-muni-permis" onchange="applyFilters('permis')"></select>
    <div class="checkbox-row">
      <input type="checkbox" id="filter-expire-permis" onchange="applyFilters('permis')">
      <label for="filter-expire-permis">Expir&eacute;s ou expirant dans 12 mois</label>
    </div>
    <button class="reset" onclick="resetFilters('permis')">R&eacute;initialiser</button>
    <div class="count" id="count-permis"></div>
  </div>
  <div class="legend" id="legend-permis">
    <div class="title">L&eacute;gende</div>
    <div class="row"><span class="dot" style="background:#3aa65a"></span>Valide (&gt; 12 mois)</div>
    <div class="row"><span class="dot" style="background:#e8892f"></span>Expire dans 12 mois</div>
    <div class="row"><span class="dot" style="background:#d1402f"></span>D&eacute;j&agrave; expir&eacute;</div>
  </div>
</div>

<script>
const REGION_NAMES = {
  1: "01 Bas-Saint-Laurent", 2: "02 Saguenay–Lac-Saint-Jean", 3: "03 Capitale-Nationale", 4: "04 Mauricie",
  5: "05 Estrie", 6: "06 Montréal", 7: "07 Outaouais", 8: "08 Abitibi-Témiscamingue", 9: "09 Côte-Nord",
  10: "10 Nord-du-Québec", 11: "11 Gaspésie–Îles-de-la-Madeleine", 12: "12 Chaudière-Appalaches",
  13: "13 Laval", 14: "14 Lanaudière", 15: "15 Laurentides", 16: "16 Montérégie", 17: "17 Centre-du-Québec"
};

const QC_CENTER = [50.0, -70.5];
const QC_ZOOM = 6;

let allPoints = [];

const state = {
  sites: { raw: [], data: [], map: null, cluster: null },
  permis: { raw: [], data: [], map: null, cluster: null },
};

function numberFmt(n) {
  return new Intl.NumberFormat('fr-CA').format(Math.round(n));
}

function permitStatus(d) {
  if (!d.date_expiration) return 'ok';
  const exp = new Date(d.date_expiration);
  const now = new Date();
  if (exp < now) return 'expired';
  const in12 = new Date(now); in12.setFullYear(in12.getFullYear() + 1);
  if (exp <= in12) return 'soon';
  return 'ok';
}

function colorForSite(d) {
  return d.has_permit ? '#3aa65a' : '#9a9a9a';
}

function colorForPermis(d) {
  const st = permitStatus(d);
  if (st === 'expired') return '#d1402f';
  if (st === 'soon') return '#e8892f';
  return '#3aa65a';
}

function clusterIcon(color) {
  return function (cluster) {
    const count = cluster.getChildCount();
    const size = count < 10 ? 32 : count < 50 ? 38 : count < 200 ? 46 : 54;
    return L.divIcon({
      html: `<div class="site-cluster" style="width:${size}px;height:${size}px;background:${color};font-size:${size > 40 ? 13 : 11}px;">${count}</div>`,
      className: '',
      iconSize: L.point(size, size),
    });
  };
}

function cleanAddr(s) {
  if (!s) return s;
  return s.replace(/\s*QC\s*CANADA\s*[A-Z]\d[A-Z]\s*\d[A-Z]\d\s*$/i, '').trim();
}

function popupHtmlSites(d) {
  const adresse = d.has_permit ? cleanAddr(d.adresse_site) : `${d.no_immeuble} ${d.type_de_rue} ${d.nom_de_la_rue}, ${d.municipalite}`;
  let html = `<b class="title">${d.has_permit ? (d.nom_du_site || d.municipalite) : d.municipalite}</b>`;
  html += `📍 ${adresse}<br>`;
  html += `🏘️ ${d.municipalite} &mdash; ${d.region_nom}<br>`;
  html += `🔖 No site&nbsp;: ${d.no_site}<br>`;
  html += d.has_permit
    ? `<span class="ok">✔ Permis actif (${d.no_permis})</span>`
    : `<span style="color:#777;">Aucun permis actif associ&eacute;</span>`;
  return html;
}

function popupHtmlPermis(d) {
  const st = permitStatus(d);
  let html = `<b class="title">${d.nom_du_site || d.titulaire}</b>`;
  html += `👤 ${d.titulaire}<br>`;
  html += `📍 ${cleanAddr(d.adresse_site)}<br>`;
  html += `🏘️ ${d.municipalite} &mdash; ${d.region_nom}<br>`;
  html += `🔖 No permis&nbsp;: ${d.no_permis}<br>`;
  html += `📅 &Eacute;mission&nbsp;: ${d.date_emission || '—'}<br>`;
  html += st === 'expired'
    ? `<span class="warn">⚠ Expir&eacute; le ${d.date_expiration}</span><br>`
    : st === 'soon'
      ? `<span class="warn">⚠ Expire le ${d.date_expiration}</span><br>`
      : `📅 Expiration&nbsp;: ${d.date_expiration || '—'}<br>`;
  html += `🔧 Prochaine v&eacute;rification&nbsp;: ${d.date_prochaine_verif || '—'}<br>`;
  html += `🛢️ Capacit&eacute; autoris&eacute;e&nbsp;: ${d.capacite_litres != null ? numberFmt(d.capacite_litres) + ' L' : '—'}<br>`;
  html += `⚙️ Nombre d'appareils autoris&eacute;s&nbsp;: ${d.nbre_autorise != null ? numberFmt(d.nbre_autorise) : '—'}`;
  return html;
}

function initMap(key, color) {
  const s = state[key];
  s.map = L.map('map-' + key, { zoomControl: true, preferCanvas: true }).setView(QC_CENTER, QC_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18,
  }).addTo(s.map);
}

function draw(key) {
  const s = state[key];
  if (s.cluster) s.map.removeLayer(s.cluster);

  s.cluster = L.markerClusterGroup({
    maxClusterRadius: 50,
    iconCreateFunction: clusterIcon(key === 'sites' ? '#2f8f57' : '#2f6f8f'),
  });

  s.data.forEach(d => {
    const color = key === 'sites' ? colorForSite(d) : colorForPermis(d);
    const marker = L.circleMarker([d.lat, d.lon], {
      radius: 7,
      fillColor: color,
      color: '#2b2b2b',
      weight: 1,
      fillOpacity: 0.85,
    });
    marker.bindPopup(key === 'sites' ? popupHtmlSites(d) : popupHtmlPermis(d));
    s.cluster.addLayer(marker);
  });

  s.map.addLayer(s.cluster);

  document.getElementById('count-' + key).textContent = `${numberFmt(s.data.length)} point(s) affiché(s)`;
  document.getElementById('infobar-' + key).textContent =
    (key === 'sites' ? '\u{1F6E2}️ Sites et équipements pétroliers — ' : '\u{1F4CB} Titulaires de permis — ')
    + `${numberFmt(s.data.length)} ${key === 'sites' ? 'site(s)' : 'permis'}`;
}

function populateFilters(key) {
  const regionSel = document.getElementById('filter-region-' + key);
  const muniSel = document.getElementById('filter-muni-' + key);
  const dataList = document.getElementById('datalist-' + key);

  regionSel.innerHTML = '<option value="">Toutes les régions</option>' +
    Object.entries(REGION_NAMES).map(([code, name]) => `<option value="${code}">${name}</option>`).join('');

  const allMunis = [...new Set(state[key].raw.map(d => d.municipalite))].sort((a,b) => a.localeCompare(b, 'fr'));
  muniSel.innerHTML = '<option value="">Toutes les municipalités</option>' +
    allMunis.map(m => `<option value="${m}">${m}</option>`).join('');
  dataList.innerHTML = allMunis.map(m => `<option value="${m}">`).join('');
}

function applyFilters(key) {
  const regionVal = document.getElementById('filter-region-' + key).value;
  const muniVal = document.getElementById('filter-muni-' + key).value;
  const sansPermisOnly = key === 'sites' && document.getElementById('filter-sanspermis-sites').checked;
  const expireOnly = key === 'permis' && document.getElementById('filter-expire-permis').checked;

  state[key].data = state[key].raw.filter(d => {
    if (regionVal && String(d.region_code) !== regionVal) return false;
    if (muniVal && d.municipalite !== muniVal) return false;
    if (sansPermisOnly && d.has_permit) return false;
    if (expireOnly && permitStatus(d) === 'ok') return false;
    return true;
  });
  draw(key);

  if (muniVal) {
    const pts = state[key].data.map(d => [d.lat, d.lon]);
    if (pts.length) state[key].map.fitBounds(pts, { padding: [60, 60], maxZoom: 13 });
  } else if (regionVal) {
    const pts = state[key].data.map(d => [d.lat, d.lon]);
    if (pts.length) state[key].map.fitBounds(pts, { padding: [40, 40] });
  } else {
    state[key].map.setView(QC_CENTER, QC_ZOOM);
  }
}

function resetFilters(key) {
  document.getElementById('filter-region-' + key).value = '';
  document.getElementById('filter-muni-' + key).value = '';
  if (key === 'sites') document.getElementById('filter-sanspermis-sites').checked = false;
  if (key === 'permis') document.getElementById('filter-expire-permis').checked = false;
  document.getElementById('search-' + key).value = '';
  applyFilters(key);
}

function goToSearch(key) {
  const val = document.getElementById('search-' + key).value.trim();
  if (!val) return;
  const match = state[key].raw.find(d => d.municipalite.toLowerCase() === val.toLowerCase());
  if (match) {
    document.getElementById('filter-muni-' + key).value = match.municipalite;
    applyFilters(key);
  } else {
    alert("Municipalité introuvable dans ce jeu de données.");
  }
}

function switchTab(key) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + key).classList.add('active');
  document.getElementById('tab-btn-' + key).classList.add('active');
  if (state[key].map) {
    setTimeout(() => state[key].map.invalidateSize(), 50);
  }
}

async function main() {
  initMap('sites');
  initMap('permis');

  const res = await fetch('sites_points.json');
  allPoints = await res.json();

  state.sites.raw = allPoints;
  state.sites.data = allPoints;
  populateFilters('sites');
  draw('sites');

  const permisPoints = allPoints.filter(d => d.has_permit);
  state.permis.raw = permisPoints;
  state.permis.data = permisPoints;
  populateFilters('permis');
  draw('permis');
}

main();
</script>

</body>
</html>
